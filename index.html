<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta regresiva</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .container {
    text-align: center;
    padding: 2rem;
  }
  .lock-icon {
    width: 96px;
    height: 96px;
    margin: 0 auto 2rem;
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.75; transform: scale(1.04); }
  }
  .label {
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 1.5rem;
  }
  .timer {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 70px;
  }
  .unit .value {
    font-size: 2.8rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .unit .unit-label {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #999;
    margin-top: 0.5rem;
  }
  .done {
    font-size: 1.6rem;
    font-weight: 600;
    color: #f5f5f5;
  }
  @media (max-width: 480px) {
    .unit .value { font-size: 2rem; }
    .timer { gap: 1rem; }
  }
</style>
</head>
<body>
  <div class="container">
    <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="#f5f5f5" stroke-width="1.2">
      <rect x="4" y="10" width="16" height="10" rx="2"/>
      <path d="M7 10V7a5 5 0 0 1 10 0v3"/>
      <circle cx="12" cy="15" r="1.6" fill="#f5f5f5" stroke="none"/>
    </svg>
    <div class="label">Se revela en</div>
    <div id="timer" class="timer"></div>
  </div>

<script>
  // Cambia esta fecha/hora si necesitas otro horario u otro año
  const targetDate = new Date("2026-08-24T00:00:00");

  const timerEl = document.getElementById("timer");

  function render(days, hours, minutes, seconds) {
    timerEl.innerHTML = `
      <div class="unit"><div class="value">${String(days).padStart(2,"0")}</div><div class="unit-label">días</div></div>
      <div class="unit"><div class="value">${String(hours).padStart(2,"0")}</div><div class="unit-label">horas</div></div>
      <div class="unit"><div class="value">${String(minutes).padStart(2,"0")}</div><div class="unit-label">min</div></div>
      <div class="unit"><div class="value">${String(seconds).padStart(2,"0")}</div><div class="unit-label">seg</div></div>
    `;
  }

  function tick() {
    const now = new Date();
    const diff = targetDate - now;

    if (diff <= 0) {
      timerEl.innerHTML = `<div class="done">Disponible ahora</div>`;
      clearInterval(intervalId);
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    render(days, hours, minutes, seconds);
  }

  tick();
  const intervalId = setInterval(tick, 1000);
</script>
</body>
</html>
